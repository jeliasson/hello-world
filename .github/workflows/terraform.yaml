name: Terraform

on:
  schedule:
    - cron: '0 6 * * 1'

  push:
    branches:
      - main
      - feature/**
      - fix/**

    paths:
      - '.github/workflows/terraform.yaml'
      - 'hello-world/terraform/**'

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: hashicorp/setup-terraform@v4

      - name: Test
        run: make terraform
