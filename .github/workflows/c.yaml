name: C

on:
  schedule:
    - cron: '0 6 * * 1'

  push:
    branches:
      - main
      - feature/**
      - fix/**

    paths:
      - '.github/workflows/c.yaml'
      - 'hello-world/c/**'

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Test
        run: make c
