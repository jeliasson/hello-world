name: Python

on:
  schedule:
    - cron: '0 6 * * 1'

  push:
    branches:
      - main
      - feature/**
      - fix/**

    paths:
      - '.github/workflows/python.yaml'
      - 'hello-world/python/**'

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        run: make python
