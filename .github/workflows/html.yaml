name: HTML

on:
  schedule:
    - cron: '0 6 * * 1'

  push:
    branches:
      - main
      - feature/**
      - fix/**

    paths:
      - '.github/workflows/html.yaml'
      - 'hello-world/html/**'

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt install -y lynx

      - name: Test
        run: make html
